server:
  port: 8090

platform:
  bootstrap:
    # Override PLATFORM_BOOTSTRAP_PASSWORD for every deployment. It is accepted
    # only while the first platform administrator is being created.
    username: ${PLATFORM_BOOTSTRAP_USERNAME:su}
    password: ${PLATFORM_BOOTSTRAP_PASSWORD:ChangeMe!123}

spring:
  application:
    name: Spring-AI
  flyway:
    enabled: true
    locations: classpath:db
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: jdbc:postgresql://localhost:5432/aichat
    username: postgres
    password: 123456
  ai:
    vectorstore:
      pgvector:
        ##embedding的向量维度，这里的768是根据nomic-embed-text返回的向量维度配置的
        dimensions: 768
    openai:
      embedding:
        enabled: false # 关闭openai的embedding自动配置，防止与Ollama的embedding冲突
      api-key: ${OPENAI_API_KEY:dev-only-openai-key-not-configured}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.9

    ollama:
      chat:
        enabled: false  # 关闭Ollama的chat自动配置，防止与openai的chat冲突
      embedding:
        model: quentinz/bge-base-zh-v1.5:latest


logging:
  level: # 配置启动查看对话日志
    org.springframework.ai.chat.client.advisor: debug
    com.starsea.ai: debug
mybatis-plus:
  configuration:
    cache-enabled: true

file:
  uploadPath: ${user.dir}/src/main/resources/file/
  outputPath: ${user.dir}/src/main/resources/output/

chunking:
  recovery:
    timeout: 10m
  tokenizer:
    resource: tokenizer/bge-base-zh-v1.5-tokenizer.json
    sha256: 7dfbf1966ebf99d471c3796e9b457329d2b2182b817e144f1e904b957745c839
  executor:
    core-size: 2
    max-size: 4
    queue-capacity: 64
    thread-name-prefix: chunking-

jwt:
  secret: dev-secret-please-change-32bytes-minimum-length-required
  access-ttl-millis: 900000       # 15 min
  refresh-ttl-millis: 2592000000  # 30 days

external-api:
  require-https: false
  trusted-proxies: []
  authentication-failure-threshold: 5
  authentication-failure-block-seconds: 60
  authentication-failure-maximum-size: 20000
  retrieval-timeout: 10s
  retrieval-executor-threads: 16
  retrieval-executor-queue-capacity: 64
  api-key:
    active-pepper-version: v1
    peppers:
      v1: ${RAG_API_KEY_PEPPER_V1:dev-only-rag-pepper-v1-change-me-32bytes}
    positive-cache-ttl: 60s
    negative-cache-ttl: 10s
    positive-cache-maximum-size: 10000
    negative-cache-maximum-size: 20000
    max-knowledge-bases: 50
